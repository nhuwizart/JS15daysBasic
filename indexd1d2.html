<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2</title>
</head>
<body>
    <!-- EASY -->
     <!-- Check even, odd -->
      <h1>Check even, odd</h1>
      <div class="even-odd">
            <input type="text" class="inputEle" placeholder="Enter a number > 0">
            <button class="fn-btn">Check even or odd?</button>
            <div class="result"></div>
      </div>
      



        <!-- Score Ranking -->
    <h1>Score Ranking</h1>
    <div class="score-ranking">
            <input type="text" class="scoreEle" placeholder="Enter score from 0 to 5">
            <button class="rank-btn">View Rank</button>
            <div class="result"></div>
    </div>



    <!-- Index of day -->
    <h1>Index of day</h1>

    <div class="nameofday">
            <input type="text" class="day" placeholder="Enter a day of week">
            <button class="day-btn">View Name of Day</button>
            <div class="result"></div>
    </div>


    <!-- Guess Number Game -->
     <h1>Guess Number Game</h1>
     <div class="guess-game">
            <input type="text" class="input-random" placeholder="Enter a number from 1 to 10">
            <button class="random-btn">View result</button>
            <div class="hint"></div>
            <div class="result"></div>
    </div>
    <script src="./assets/functiond1d2.js">
   
    </script>
</body>
</html>
